<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Experiences | OGMedia</title>
    <link rel="icon" type="image/svg+xml" href="assets/og-engine-logo.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OGMedia" />
    <meta property="og:title" content="Web Experiences | OGMedia" />
    <meta
      property="og:description"
      content="Explore OGMedia's web experiences, interactive installations, and digital events."
    />
    <meta property="og:url" content="https://ogengine.co/portfolio/web-experiences.html" />
    <meta
      property="og:image"
      content="https://ogengine.co/portfolio/og-portfolio.jpg"
    />
    <meta name="twitter:title" content="Web Experiences | OGMedia" />
    <meta
      name="twitter:description"
      content="Explore OGMedia's web experiences, interactive installations, and digital events."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://ogengine.co/portfolio/og-portfolio.jpg"
    />
    <meta name="theme-color" content="#050505" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://d3p12bvhtoj2vu.cloudfront.net" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="detail-page portfolio-case" data-case="web">
    <section class="case-landing">
      <img class="case-landing-image" data-case-hero alt="" />
      <div class="case-landing-overlay" aria-hidden="true"></div>
      <div class="case-landing-top">
        <a
          href="index.html"
          class="case-landing-logo"
          aria-label="Back to home"
        >
          <img src="assets/og-engine-logo.svg" alt="OG logo" width="775" height="270" />
        </a>
        <span data-case-hero-label></span>
        <button class="case-menu" type="button" aria-label="Open menu">
          &#9776;
        </button>
      </div>
      <p class="case-landing-description" data-case-description></p>
      <h1 class="case-landing-title" data-case-hero-title></h1>
    </section>
    <header class="case-header">
      <a class="case-header-logo" href="index.html" aria-label="Home"
        ><img src="assets/og-engine-logo.svg" alt="OG logo"
      /></a><span data-case-label></span>
    </header>
    <main class="case-shell">
      <section class="case-story">
        <p class="case-index" data-case-index></p>
        <p class="case-eyebrow" data-case-eyebrow></p>
        <h1 class="case-headline" data-case-headline></h1>
      </section>
      <!-- case-feature--caption-below: the caption sits below the picture. -->
      <figure class="case-feature case-feature--caption-below">
        <img class="case-feature-image" data-case-feature alt="" />
        <!-- Filled by case.js with the selected project. -->
        <figcaption class="case-feature-caption">
          <div>
            <p class="case-person" data-case-person></p>
            <p class="case-role" data-case-role></p>
          </div>
          <div class="case-about">
            <p data-case-about></p>
            <a
              class="case-link"
              data-case-link
              target="_blank"
              rel="noopener noreferrer"
              hidden
              >Visit website &#8599;</a
            >
          </div>
        </figcaption>
      </figure>
      <nav
        class="case-thumbnails"
        data-case-thumbnails
        aria-label="Related work"
      ></nav>
    </main>
    <!-- More of our work: galleries filled by case.js (webPortfolioCategories). -->
    <section
      class="media-portfolio"
      data-media-portfolio
      aria-labelledby="web-portfolio-title"
    >
      <header class="media-portfolio-header">
        <p class="case-eyebrow">Beyond the highlights</p>
        <h2 id="web-portfolio-title">More of our work</h2>
        <p>
          Websites and digital products we've designed, built and brought online.
        </p>
      </header>
      <div
        class="media-portfolio-categories"
        data-media-portfolio-categories
      ></div>
    </section>
    <footer class="case-footer">
      <a href="index.html">Back to index</a>
      <span class="case-footer-credit">
        Since 2026 /
        <img src="assets/og-engine-logo.svg" alt="OG logo" />
      </span>
    </footer>
    <script type="module" src="case.js"></script>
  </body>
</html>
