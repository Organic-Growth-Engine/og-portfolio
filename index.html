<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studioform®</title>
  <meta name="description"
    content="We partner with startups and visionaries to craft brand identities, digital experiences, and narratives that resonate.">

  <!-- Modern Typography (Plus Jakarta Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Custom Magnetic Cursor -->
  <div class="cursor-dot" id="cursor-dot" aria-hidden="true"></div>
  <div class="cursor-circle" id="cursor-circle" aria-hidden="true"></div>

  <!-- Fullscreen Landing Page (Drops.jpg Background, 100% Top to Bottom & Left to Right) -->
  <main class="studio-landing" id="studio-landing">
    <!-- Studio Background Image with Ambient Glow & Edge Transition -->
    <div class="studio-bg-wrapper" aria-hidden="true">
      <!-- Cinematic Ambient Blue Glow Between Image & Background -->
      <div class="studio-ambient-glow"></div>

      <!-- Image Frame & Seamless Edge Blend -->
      <div class="studio-image-frame">
        <img src="assets/drops.jpg" alt="Studio Backdrop" class="studio-bg-img" id="studio-bg-img">
        <div class="studio-edge-blend"></div>
      </div>
    </div>

    <!-- Top Navigation Header -->
    <header class="top-nav-bar">
      <div class="nav-left">
        <a href="#" class="brand-logo" id="brand-logo" aria-label="OG Engine">
          <img src="assets/og engine 3 (1) (1).svg" alt="OG Engine" class="brand-logo-img">
        </a>
      </div>

      <nav class="nav-menu" aria-label="Main Navigation">
        <div class="nav-links">
          <a href="#work" class="nav-link">Work</a>
          <a href="#index" class="nav-link">Index</a>
          <a href="#about" class="nav-link">About</a>
          <a href="#blog" class="nav-link">Blog</a>
        </div>
        <a href="#contact" class="nav-link contact-link">Contact</a>
      </nav>
    </header>

    <!-- Bottom Content Area -->
    <footer class="bottom-content-bar">
      <div class="manifesto-col">
        <h1 class="manifesto-statement">
          We partner with startups and<br>
          visionaries to craft brand identities,<br>
          digital experiences, and narratives<br>
          that resonate.
        </h1>
      </div>

      <div class="scroll-col">
        <a href="#scroll" class="scroll-link" id="scroll-link" aria-label="Scroll">
          <span class="scroll-text">(Scroll)</span>
        </a>
      </div>
    </footer>

  </main>

  <!-- Brand Identity Section -->
  <section class="brand-section" id="brand-section">
    <!-- Background: pure black for now — drop your image here later -->
    <div class="brand-bg" aria-hidden="true">
      <div class="brand-overlay"></div>
    </div>

    <!-- Centered Massive Title -->
    <div class="brand-center">
      <p class="brand-title">MEDIA</p>
    </div>


  </section>

  <!-- Editing Section -->
  <section class="brand-section" id="editing-section">
    <div class="brand-bg" aria-hidden="true">
      <div class="brand-overlay"></div>
    </div>

    <div class="brand-center">
      <p class="brand-title">Editing</p>
    </div>


  </section>

  <!-- Footer -->
  <footer class="og-footer" id="og-footer">
    <!-- Chrome/Mercury Dot-Matrix Halftone Effect (matching Daylight) -->
    <div class="og-footer-dots-grid" aria-hidden="true"></div>
    <!-- Chrome/Mercury Ambient Glow -->
    <div class="og-footer-glow" aria-hidden="true"></div>

    <!-- Main hero row: logo LEFT + wordmark -->
    <div class="og-footer-hero">
      <div class="og-footer-logo-wrap">
        <img src="assets/og-engine-logo.svg?v=2" alt="OG Engine Logo" class="og-footer-logo-img" />
      </div>
      <span class="og-footer-wordmark">OGEngine</span>
    </div>

    <!-- Bottom 3-column info bar (Faithful to Daylight layout) -->
    <div class="og-footer-bottom">
      <div class="og-footer-col">
        <span class="og-footer-dot" aria-hidden="true"></span>
        <div class="og-footer-lines">
          <span>© 2025 OG ENGINE</span>
          <span>CREATIVE GROWTH STUDIO</span>
        </div>
      </div>
      <div class="og-footer-col">
        <span class="og-footer-dot" aria-hidden="true"></span>
        <div class="og-footer-lines">
          <span>NEW DELHI,</span>
          <span>INDIA</span>
        </div>
      </div>
      <div class="og-footer-col">
        <span class="og-footer-dot" aria-hidden="true"></span>
        <div class="og-footer-lines">
          <span>OG ENGINE IS A CREATIVE</span>
          <span>GROWTH & DESIGN STUDIO</span>
        </div>
      </div>
    </div>
  </footer>

  <script type="module" src="app.js"></script>
</body>

</html>
